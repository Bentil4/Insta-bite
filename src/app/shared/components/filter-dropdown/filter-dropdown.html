<button
  type="button"
  class="dropdown-trigger"
  [class.is-open]="isDropdownOpen()"
  [attr.aria-expanded]="isDropdownOpen()"
  [attr.aria-haspopup]="'listbox'"
  [attr.aria-label]="label()"
  (click)="toggleDropdownVisibility($event)"
>
  <span class="dropdown-label">{{ label() }}</span>
  <img
    src="/assets/images/icon-chevron-down.svg"
    alt=""
    class="dropdown-icon"
    [class.rotated]="isDropdownOpen()"
  />
</button>

@if (isDropdownOpen()) {
  <div class="dropdown-menu" role="listbox" [attr.aria-label]="label() + ' options'">
    @for (option of options(); track option.value) {
      <button
        type="button"
        role="option"
        class="dropdown-option"
        [attr.aria-selected]="selectedValue() === option.value"
        (click)="selectFilterOption(option.value)"
      >
        <span class="option-radio" [class.selected]="selectedValue() === option.value">
          @if (selectedValue() === option.value) {
            <span class="radio-dot"></span>
          }
        </span>
        <span>{{ option.label }}</span>
      </button>
    }

    <div class="dropdown-divider"></div>

    <button type="button" class="dropdown-clear" (click)="clearFilterSelection()">Clear</button>
  </div>
}

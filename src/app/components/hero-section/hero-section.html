<section class="hero-section" aria-labelledby="hero-title">
  <img
    ngSrc="/assets/images/pattern-squiggle-1.svg"
    alt=""
    width="1774"
    height="1556"
    class="hero-pattern"
    aria-hidden="true"
  />

  <div class="hero-content">
    <h1 id="hero-title" class="hero-title">
      <span class="hero-highlight">
        Healthy
        <span class="hero-underline" aria-hidden="true"></span>
      </span>
      meals, zero fuss
    </h1>
    <p class="hero-description">
      Discover eight quick, whole-food recipes that you can cook tonight—no processed junk, no
      guesswork.
    </p>
  </div>

  <app-button [size]="'large'">Start exploring</app-button>

  <div class="hero-image-container">
    <img
      ngSrc="/assets/images/image-home-hero-large.webp"
      alt="A colorful spread of fresh, healthy ingredients including vegetables, fruits, and whole grains arranged beautifully on a table"
      fill
      priority
      class="hero-image"
    />
  </div>
</section>

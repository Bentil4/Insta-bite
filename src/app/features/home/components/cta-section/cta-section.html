<section class="cta-section" aria-labelledby="cta-title">
  <img
    ngSrc="/assets/images/pattern-fork.svg"
    alt=""
    width="179"
    height="232"
    class="cta-pattern-fork"
    aria-hidden="true"
  />

  <img
    ngSrc="/assets/images/pattern-knife.svg"
    alt=""
    width="172"
    height="172"
    class="cta-pattern-knife"
    aria-hidden="true"
  />

  <section class="cta-content">
    <div class="cta-text">
      <h2 id="cta-title" class="cta-title">Ready to cook smarter?</h2>
      <p class="cta-description">
        Hit the button, pick a recipe, and get dinner on the table—fast.
      </p>
    </div>

    <app-button [size]="'large'">Browse recipes</app-button>
  </section>
</section>
